[tool.pytest.ini_options]
django_settings_module = "ruralhealth.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["backend/api/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["backend/api"]
omit = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "venv",
    "backend/venv",
    "migrations",
    "staticfiles",
    "backend/staticfiles",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "DJ",   # Django-specific checks
]
ignore = [
    "B008",   # function call in default argument - common in DRF field definitions
    "E501",   # long lines are reported by the formatter, not the linter
    "DJ001",  # null=True on string fields: changing these needs a data migration
]

[tool.ruff.lint.per-file-ignores]
"backend/api/views/__init__.py" = ["F401"]
"backend/api/tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "preserve"

[tool.bandit]
exclude_dirs = ["backend/venv", "backend/api/tests", "backend/api/migrations"]
skips = ["B101"]
