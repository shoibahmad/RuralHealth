# Brings up the full stack - PostgreSQL plus the combined API/SPA container -
# with no manual setup:
#
#   cp backend/.env.example backend/.env   # optional: adds your Gemini key
#   docker compose up --build
#
# The app is then served on http://localhost:8000.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ruralhealth
      POSTGRES_PASSWORD: ruralhealth
      POSTGRES_DB: ruralhealth
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruralhealth -d ruralhealth"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        # Public Firebase client identifiers; the SPA needs them inlined at
        # build time. Leave unset to run the API without Firebase auth.
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-development-only-do-not-use-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DATABASE_URL: postgres://ruralhealth:ruralhealth@db:5432/ruralhealth
      # Leave blank to run with AI features disabled; the app degrades cleanly.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
