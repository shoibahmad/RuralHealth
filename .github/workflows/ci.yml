name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Coverage floors. Raise them as coverage improves; never lower them.
  BACKEND_MIN_COVERAGE: "85"

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      # Installing from the lockfile is what makes CI reproducible; the loose
      # ranges in requirements.txt are only for resolving a new lock.
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check --output-format=github .

      - name: Check formatting (ruff)
        working-directory: backend
        run: ruff format --check .

      - name: Django system checks
        working-directory: backend
        run: python manage.py check --fail-level WARNING

      - name: Verify migrations are up to date
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage gate
        working-directory: backend
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=${{ env.BACKEND_MIN_COVERAGE }}

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Check formatting (prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      # Thresholds are declared in frontend/vitest.config.ts.
      - name: Run tests with coverage gate
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 14

      - name: Build
        working-directory: frontend
        run: npm run build

  security:
    name: Security & vulnerability scan (SAST)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run Python SAST security scan (bandit)
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          bandit -r backend/api -x backend/api/tests -s B105 -q

      - name: Run Python dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock.txt

  smoke-test:
    name: Fresh-clone container smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Proves a fresh clone still produces a runnable image.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ruralhealth-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the running container
        run: |
          docker run -d --name ruralhealth \
            -e SECRET_KEY=ci-smoke-test-key \
            -e DEBUG=False \
            -e ALLOWED_HOSTS='*' \
            -p 8000:8000 ruralhealth-ai:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "Health check passed on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Health check never succeeded; container logs follow:"
              docker logs ruralhealth
              exit 1
            fi
            sleep 2
          done

          # The SPA has to be served too, not just the API.
          curl -fsS http://localhost:8000/ | grep -q '<!doctype html>' \
            || { echo "Frontend bundle was not served"; exit 1; }

          # An end-to-end write path through the API.
          curl -fsS -X POST http://localhost:8000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","full_name":"CI","password":"ci-smoke-pass"}' \
            | grep -q '"role"' || { echo "Registration failed"; exit 1; }

          echo "Container smoke test passed"

      - name: Stop the container
        if: always()
        run: docker rm -f ruralhealth || true

  deploy-check:
    name: Deployment artifact validation
    needs: [backend, frontend, security, smoke-test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build frontend production bundle
        run: npm run build

      - name: Verify dist artifacts
        run: |
          test -f frontend/dist/index.html || { echo "index.html missing"; exit 1; }
          test -d frontend/dist/assets || { echo "assets directory missing"; exit 1; }
          echo "Production frontend build artifacts verified successfully."
