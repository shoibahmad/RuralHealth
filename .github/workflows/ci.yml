name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (Django ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Django system checks
        working-directory: backend
        run: python manage.py check --fail-level WARNING

      - name: Verify migrations are up to date
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: backend
        run: pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Proves a fresh clone still produces a runnable image.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ruralhealth-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the health endpoint
        run: |
          docker run -d --name ruralhealth \
            -e SECRET_KEY=ci-smoke-test-key \
            -e DEBUG=False \
            -e ALLOWED_HOSTS='*' \
            -p 8000:8000 ruralhealth-ai:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "\nHealth check passed on attempt $attempt"
              exit 0
            fi
            sleep 2
          done

          echo "Health check never succeeded; container logs follow:"
          docker logs ruralhealth
          exit 1

      - name: Stop the container
        if: always()
        run: docker rm -f ruralhealth || true
